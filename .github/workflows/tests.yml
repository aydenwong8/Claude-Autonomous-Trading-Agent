name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      # No secrets: every test runs on fakes or recorded responses. The golden
      # prompt test skips here because its fixture is gitignored.
      - run: python -m pytest -q
